name: Toolchain refresh

# Keeps the starters and templates on the newest COMPATIBLE toolchain (peer-aware: typescript stays on 6.x while
# @astrojs/check peers ^5 || ^6, an Astro major waits for its integrations). Opens a PR when anything changed; a human
# merges it after validation passes. Nothing is pinned exactly.

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: toolchain-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh starters
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Lint starters
        run: node Web_Toolkit/package_updater/bin/package-updater.mjs doctor --offline

      - name: Resolve and write newer compatible ranges
        run: |
          node Web_Toolkit/package_updater/bin/package-updater.mjs refresh-starters --apply | tee refresh.log
          node scripts/sync-readme-versions.mjs

      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "Starters are already current."
            exit 0
          fi
          branch="chore/toolchain-refresh"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add -A site-starter Web_Toolkit/templates README.md
          git commit -m "chore: refresh starter toolchain ranges"
          git push --force origin "$branch"
          body="$(printf 'Automated peer-aware refresh. Held-back packages are listed with reasons in the log below.\n\n```\n%s\n```\n' "$(cat refresh.log)")"
          if gh pr view "$branch" >/dev/null 2>&1; then
            gh pr edit "$branch" --body "$body"
          else
            gh pr create --head "$branch" --base main --title "chore: refresh starter toolchain ranges" --body "$body"
          fi
