name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Release and toolkit validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install pnpm
        # npm ships with Node; pnpm is the toolkit's package manager (no version is pinned).
        run: npm install --global pnpm

      - name: Install WCAGate engine
        # The wcag-auditor wrapper tests need @imyourboyroy/wcagate under Web_Toolkit/node_modules.
        # This used to be installed only as a side effect of the toolkit auto-update preflight.
        run: pnpm install --dir Web_Toolkit --ignore-scripts

      - name: Validate repository
        run: pnpm run validate

      - name: Verify Vectorize Pipeline dependency lock
        run: |
          pnpm install --frozen-lockfile --ignore-scripts --dir Web_Toolkit/vectorize_pipeline
          pnpm --dir Web_Toolkit/vectorize_pipeline audit --audit-level high
          node Web_Toolkit/vectorize_pipeline/bin/vectorize-pipeline.mjs --help >/dev/null
