name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Release and toolkit validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Validate repository
        run: npm run validate

      - name: Verify Vectorize Pipeline dependency lock
        run: |
          npm ci --ignore-scripts --prefix Web_Toolkit/vectorize_pipeline
          npm --prefix Web_Toolkit/vectorize_pipeline audit --audit-level=high
          node Web_Toolkit/vectorize_pipeline/bin/vectorize-pipeline.mjs --help >/dev/null
