# Add to the client wrangler.toml (Workers target). Copy map: see README.md in this folder.

# Custom Worker entry: wraps the Astro handler with Accept: text/markdown negotiation (src/worker.ts).
# Remove `main` and the [assets] block to switch negotiation off; Markdown twins and Link headers still work.
# Top-level keys such as `main` must come before any [table].
main = "src/worker.ts"

# Only page routes pass through the Worker first. List each top-level section of the site; a route missing from this
# list is safe (it answers HTML only). Static files (/_astro, images, fonts, /*.md twins) stay on the assets layer.
[assets]
run_worker_first = [
  "/",
  "/about*",
  "/contact*",
  "!/*.md",
]

# Use a namespace_id that no other Worker in the account uses (counters are keyed per namespace). Example ids: 1001, 1002, 1003.
# Per-IP limit for the public read APIs (see src/lib/discovery/ratelimit.ts). Counters are per Cloudflare location.
[[ratelimits]]
name = "API_RATE_LIMIT"
namespace_id = "1001"
simple = { limit = 60, period = 60 }
