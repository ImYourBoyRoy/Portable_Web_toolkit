# Copy to project root as wrangler.toml (Workers / SSR Astro sites).
# Deploy uses dist/server/wrangler.json generated by @astrojs/cloudflare after build.

name = "[WORKER_NAME]"
compatibility_date = "2026-04-08"
compatibility_flags = ["nodejs_compat"]

[vars]
APP_ENV = "production"

# Add per-project bindings below (KV, D1, R2, send_email).
# Do not commit production routes or secrets in public repos.
# Prefer: wrangler deploy --config dist/server/wrangler.json --route "example.com/*"
